name: 🐛 Bug Report
description: Grain isn't doing what the docs say it does
title: "[BUG] "
labels: [bug]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this hasn't been reported
          required: true
        - label: This is a single bug (file separate reports for separate bugs)
          required: true
        - label: I'm on the latest version of Grain
          required: true
  - type: textarea
    id: actual
    attributes:
      label: What went wrong?
      placeholder: |
        I pressed Ctrl+Enter on a .sql file against my Postgres connection and
        the results panel stayed empty. No error appeared anywhere.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If schema matters, include a minimal CREATE TABLE.
      placeholder: |
        1. Add a Postgres connection, test it, make it active
        2. Open a .sql file containing `select 1;`
        3. Press Ctrl+Enter
        4. Results panel opens but never fills
    validations: { required: true }
  - type: input
    id: grain-version
    attributes:
      label: Grain version
      description: "Extensions view → Grain, or Help → About"
      placeholder: "0.10.0"
    validations: { required: true }
  - type: dropdown
    id: connector
    attributes:
      label: Connector
      options:
        - Postgres
        - MySQL
        - Elasticsearch
        - DuckDB
        - Snowflake
        - BigQuery
        - Other / not connector-specific
    validations: { required: true }
  - type: input
    id: db-version
    attributes:
      label: Database version
      placeholder: "PostgreSQL 17.2 / Elasticsearch 8.15"
    validations: { required: false }
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options: [VS Code, Cursor, Windsurf, VSCodium, Other]
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations: { required: true }
  - type: dropdown
    id: connection-method
    attributes:
      label: How do you connect?
      options: [Direct, SSH tunnel, SSL/TLS, Cloud proxy, Not applicable]
    validations: { required: true }
  - type: dropdown
    id: agent
    attributes:
      label: Was an AI agent involved?
      description: Did this happen through Grain's MCP tools rather than the editor?
      options:
        - "No — I ran the query myself"
        - "Yes — Claude Code"
        - "Yes — Cursor"
        - "Yes — GitHub Copilot"
        - "Yes — another MCP client"
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Output panel logs
      description: "View → Output → Grain"
      render: shell
    validations: { required: false }
  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Screenshots and screen recordings help — drag them in here.
    validations: { required: false }
