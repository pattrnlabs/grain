# Label taxonomy for pattrnlabs/grain — not auto-applied by any workflow yet.
# Create these via the GitHub UI, or `gh label create` from this list, before
# the repo goes public. Per-connector labels (e.g. connector:clickhouse) are
# added on demand as real issues need them, not pre-created here.

# Type (also set by issue template `labels:` fields)
